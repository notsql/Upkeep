[project]
name = "ml-research"
version = "0.0.0"
description = "ML experiments - trains and exports the models apps/server runs"
requires-python = ">=3.13"
# Deliberately minimal: add what an experiment actually needs (torch,
# scikit-learn, ...) and run `uv sync`. Training dependencies stay out of the
# serving image.
dependencies = [
    "numpy>=2.4.0",
    "jupyterlab>=4.5.0",
    "onnx>=1.20.0",
    "onnxruntime>=1.24.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "skl2onnx>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_research"]
