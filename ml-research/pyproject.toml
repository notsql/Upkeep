[project]
name = "ml-research"
version = "0.0.0"
description = "ML experiments - trains and exports the models apps/ml serves"
requires-python = ">=3.13"
# Deliberately minimal: add what an experiment actually needs (torch,
# scikit-learn, ...) and run `uv sync`. This environment is separate from
# apps/ml on purpose - training dependencies stay out of the serving image.
dependencies = [
    "numpy>=2.4.0",
    "jupyterlab>=4.5.0",
    "onnx>=1.20.0",
    "onnxruntime>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_research"]
