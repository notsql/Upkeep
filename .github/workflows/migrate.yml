name: Migrate

# Applies merged migrations to Neon. A push to dev migrates the dev branch; a
# push to main migrates prd. Work-in-progress migrations never reach either
# (0012, 0027, 0029).
on:
  push:
    branches: [dev, main]
    paths:
      - packages/db/prisma/**
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job mint a GitHub OIDC token to log in to Infisical.
  id-token: write

# Never run two migrations against the same database at once. One group per
# environment, so a dev migration never queues behind a prd one.
concurrency:
  group: migrate-neon-${{ github.ref_name == 'main' && 'prd' || 'dev' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to Neon (${{ github.ref_name == 'main' && 'prd' || 'dev' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NX_NO_CLOUD: "true"
      # main -> Infisical prd (Neon prd branch); dev -> Infisical dev.
      INFISICAL_ENV: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}

    # Every command runs from the repo root, like the root `pnpm db:*` scripts.
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Exports DATABASE_URL from Infisical's /packages/db folder in the
      # branch's environment (dev is the one `pnpm db:migrate` reads locally). It must be Neon's direct (non -pooler)
      # URL: migrate deploy takes an advisory lock PgBouncer does not support.
      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV }}
          secret-path: /packages/db
          secret-name: DATABASE_URL

      # Version comes from "packageManager" in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prisma migrate deploy`, not `db:migrate`: that is `migrate dev`, which
      # creates migrations and can reset the database.
      - name: Apply migrations
        run: pnpm db:deploy
