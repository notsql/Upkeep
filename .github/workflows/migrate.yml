name: Migrate

# Applies merged migrations to Neon. A push to dev migrates the dev branch; a
# push to main migrates prd. Work-in-progress migrations never reach either
# (0012, 0027, 0029, 0031).
on:
  push:
    branches: [dev, main]
    paths:
      - packages/db/prisma/**
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations against the same database at once. One group per
# environment, so a dev migration never queues behind a prd one.
concurrency:
  group: migrate-neon-${{ github.ref_name == 'main' && 'prd' || 'dev' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to Neon (${{ github.ref_name == 'main' && 'prd' || 'dev' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # main -> GitHub environment prd (Neon prd branch); dev -> dev.
    environment: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}

    env:
      NX_NO_CLOUD: "true"
      # Synced into the environment from Infisical's /packages/db folder by an
      # Infisical GitHub Secret Sync (0031). It must be Neon's direct
      # (non -pooler) URL: migrate deploy takes an advisory lock PgBouncer does
      # not support.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    # Every command runs from the repo root, like the root `pnpm db:*` scripts.
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Version comes from "packageManager" in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prisma migrate deploy`, not `db:migrate`: that is `migrate dev`, which
      # creates migrations and can reset the database.
      - name: Apply migrations
        run: pnpm db:deploy
