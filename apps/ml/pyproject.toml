[project]
name = "ml"
version = "0.0.0"
description = "ONNX inference service for the Spring API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.41.0",
    "onnxruntime>=1.24.0",
    "numpy>=2.4.0",
    "pydantic-settings>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.28.1",
    # Only the tests build an .onnx file; the service just runs onnxruntime.
    "onnx>=1.20.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
