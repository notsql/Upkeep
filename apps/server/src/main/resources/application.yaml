spring:
  application:
    name: server

  datasource:
    # Postgres is owned by the root docker-compose.yml (`pnpm db:start`).
    # Prisma owns the schema; Spring only reads/writes - it never migrates.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/proj}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}

  autoconfigure:
    exclude:
      # Spring AI 2.0.1's Anthropic chat auto-config cannot bind
      # `spring.ai.anthropic.chat.thinking` under Spring Boot 4.1.1 - it fails
      # with "Configuration property name '-json' is not valid" and takes the
      # whole application context down, regardless of our configuration.
      # The starter is kept on the classpath for when we build an AI feature;
      # delete this exclusion (and re-test) once Spring AI ships a fix.
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

app:
  cors:
    # Comma-separated. The web app calls the API directly from the browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}

# WorkOS AuthKit is intentionally NOT configured here, and the issuer must not
# be given an empty default: Spring's resource-server auto-configuration keys
# off the property merely being present, so a blank value would build a
# JwtDecoder against no issuer and take the context down at startup.
#
# To switch JWT validation on, set the environment variable
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
# to your AuthKit domain (e.g. https://<tenant>.authkit.app). Relaxed binding
# maps it onto spring.security.oauth2.resourceserver.jwt.issuer-uri, Spring
# discovers the JWKS from it, and SecurityConfig starts requiring a token.
# While it is unset the API stays open locally. See apps/server/.env.example.
