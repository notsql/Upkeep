spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 17MB
  application:
    name: server

  config:
    # Load apps/server/.env directly: the @nx/maven executor does not pass
    # Nx's .env loading through to the forked JVM. Real environment variables
    # still win over values in the file.
    import: optional:file:.env[.properties]

  datasource:
    # The Neon dev database, from apps/server/.env.
    # Prisma owns the schema; Spring only reads/writes - it never migrates.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}

  # Work order email (ID-70). SPRING_MAIL_HOST, SPRING_MAIL_USERNAME and
  # SPRING_MAIL_PASSWORD bind from the environment. Do not give the host a
  # default here: without one, no mail sender is created and work orders record
  # MAIL_NOT_CONFIGURED instead of failing against a blank server.
  mail:
    port: ${SPRING_MAIL_PORT:587}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 30000

  autoconfigure:
    exclude:
      # Spring AI 2.0.1's Anthropic chat auto-config cannot bind
      # `spring.ai.anthropic.chat.thinking` under Spring Boot 4.1.1 - it fails
      # with "Configuration property name '-json' is not valid" and takes the
      # whole application context down, regardless of our configuration.
      # The starter is kept on the classpath for when we build an AI feature;
      # delete this exclusion (and re-test) once Spring AI ships a fix.
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Drain rejected multipart requests so callers receive the JSON 413 response
    # instead of a connection reset while their request body is still arriving.
    max-swallow-size: 20MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    # Off in the packaged jar (Cloud Run, docker compose). The Maven
    # spring-boot:run/start config in pom.xml turns it on for local runs.
    enabled: false

app:
  cors:
    # Comma-separated. The web app calls the API directly from the browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}
  workos:
    api-url: https://api.workos.com
    # Server-side secret for the WorkOS API (GET /users). Unlike the issuer
    # below, a blank default is safe: nothing auto-configures off it.
    api-key: ${WORKOS_API_KEY:}
  routing:
    # The model that classifies fault reports (ID-70); the key is ANTHROPIC_API_KEY.
    model: claude-haiku-5-5
  mail:
    # Blank: send as the authenticated SMTP account, with no Reply-To.
    from: ${APP_MAIL_FROM:}
    reply-to: ${APP_MAIL_REPLY_TO:}
  r2:
    endpoint: ${S3_ENDPOINT:}
    access-id: ${R2_ACCESS_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:}

# WorkOS AuthKit is intentionally NOT configured here, and the issuer must not
# be given an empty default: Spring's resource-server auto-configuration keys
# off the property merely being present, so a blank value would build a
# JwtDecoder against no issuer and take the context down at startup.
#
# To switch JWT validation on, set the environment variable
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
# to the exact iss claim of an access token. OS environment variables bind
# directly; DotenvJwtEnvironmentPostProcessor maps uppercase .env file keys
# before auto-configuration, without adding a blank issuer. Spring discovers
# the JWKS from the issuer and SecurityConfig requires a token. Also
# set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES to the API audience
# configured in the WorkOS JWT template so tokens minted for another resource
# are rejected. While the issuer is unset the API stays open locally. See
# apps/server/.env.example.
